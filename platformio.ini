;-----------------------------------------------------------------------
; M5Unit-ENV
; For UnitTest and examples (Using M5UnitUnified)
;-----------------------------------------------------------------------
[platformio]
extra_configs = unit_co2_env.ini, unit_env3_env.ini, unit_env4_env.ini, unit_envpro_env.ini, unit_tvoc_env.ini, unit_bps_env.ini, hat_yun_env.ini, unit_spa06_env.ini

[env]
build_flags =-Wall -Wextra -Wreturn-local-addr -Werror=format -Werror=return-local-addr
lib_ldf_mode = deep
test_framework = googletest
test_build_src = true
lib_deps=m5stack/M5Unified
  m5stack/M5UnitUnified@>=0.5.5
  boschsensortec/BME68x Sensor library@>=1.3.40408

; --------------------------------
[bsec2]
lib_deps = boschsensortec/bsec2@>=1.10.2610

[m5base]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 1500000
test_speed = 115200
test_ignore= native/*

[Core]
extends = m5base
board = m5stack-core-esp32-16M
lib_deps = ${env.lib_deps}

[Core2]
extends = m5base
board = m5stack-core2
lib_deps = ${env.lib_deps}

[CoreS3]
extends = m5base
board = m5stack-cores3
lib_deps = ${env.lib_deps}

[Fire]
extends = m5base
board = m5stack-fire
lib_deps = ${env.lib_deps}

[StampS3]
;include M5Capsule, DinMeter
extends = m5base
board = m5stack-stamps3
lib_deps = ${env.lib_deps}

[Dial]
extends = m5base
board = m5stack-stamps3
lib_deps = ${env.lib_deps}
  m5stack/M5Dial

[Atom]
;include AtomMatrix,AtomLite,AtomU
extends = m5base
board = m5stack-atom
lib_deps = ${env.lib_deps}

[AtomS3]
;include AtomEchoS3R,AtomS3Lite,AtomS3U
extends = m5base
board = m5stack-atoms3
lib_deps = ${env.lib_deps}

; Using ./boards/m5stack-atoms3r.json
[AtomS3R]
;include AtomEchoS3R
extends = m5base
board = m5stack-atoms3r
lib_deps = ${env.lib_deps}

; Using ./boards/m5stack-nanoc6.json
[NanoC6]
extends = m5base
board = m5stack-nanoc6
build_flags = ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps = ${env.lib_deps}

[NanoH2]
extends = m5base
board = m5stack-nanoh2
build_flags = ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps = ${env.lib_deps}

[StickCPlus]
extends = m5base
board = m5stick-c
lib_deps = ${env.lib_deps}

; Using ./boards/m5stick-cplus2.json
[StickCPlus2]
extends = m5base
board = m5stick-cplus2
lib_deps = ${env.lib_deps}

[StickS3]
extends = m5base
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_build.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps = ${env.lib_deps}


[Paper]
extends = m5base
board = m5stack-fire
lib_deps = ${env.lib_deps}

[CoreInk]
extends = m5base
board = m5stack-coreink
lib_deps = ${env.lib_deps}

[Cardputer]
extends = m5base
board = esp32-s3-devkitc-1
build_flags =
  -DESP32S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps = ${env.lib_deps}

[Tab5]
extends = m5base
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps = ${env.lib_deps}

[NessoN1]
extends = m5base
board = arduino_nesso_n1
lib_deps = ${env.lib_deps}

; --------------------------------
; Boards with BSEC2
; --------------------------------
; Opt-in BSEC2 environments for UnitENVPro IAQ. Keep the default board environments raw-only so
; libraries depending on M5Unit-ENV do not pull the Bosch prebuilt blob transitively.
[CoreBSEC2]
extends = Core
lib_deps = ${Core.lib_deps}
  ${bsec2.lib_deps}

[Core2BSEC2]
extends = Core2
lib_deps = ${Core2.lib_deps}
  ${bsec2.lib_deps}

[CoreS3BSEC2]
extends = CoreS3
lib_deps = ${CoreS3.lib_deps}
  ${bsec2.lib_deps}

[FireBSEC2]
extends = Fire
lib_deps = ${Fire.lib_deps}
  ${bsec2.lib_deps}

[StampS3BSEC2]
extends = StampS3
lib_deps = ${StampS3.lib_deps}
  ${bsec2.lib_deps}

[DialBSEC2]
extends = Dial
lib_deps = ${Dial.lib_deps}
  ${bsec2.lib_deps}

[AtomBSEC2]
extends = Atom
lib_deps = ${Atom.lib_deps}
  ${bsec2.lib_deps}

[AtomS3BSEC2]
extends = AtomS3
lib_deps = ${AtomS3.lib_deps}
  ${bsec2.lib_deps}

[AtomS3RBSEC2]
extends = AtomS3R
lib_deps = ${AtomS3R.lib_deps}
  ${bsec2.lib_deps}

[StickCPlusBSEC2]
extends = StickCPlus
lib_deps = ${StickCPlus.lib_deps}
  ${bsec2.lib_deps}

[StickCPlus2BSEC2]
extends = StickCPlus2
lib_deps = ${StickCPlus2.lib_deps}
  ${bsec2.lib_deps}

[StickS3BSEC2]
extends = StickS3
lib_deps = ${StickS3.lib_deps}
  ${bsec2.lib_deps}

[PaperBSEC2]
extends = Paper
lib_deps = ${Paper.lib_deps}
  ${bsec2.lib_deps}

[CoreInkBSEC2]
extends = CoreInk
lib_deps = ${CoreInk.lib_deps}
  ${bsec2.lib_deps}

[CardputerBSEC2]
extends = Cardputer
lib_deps = ${Cardputer.lib_deps}
  ${bsec2.lib_deps}

; No BSEC2 sections for NanoC6 / NanoH2 / NessoN1 / Tab5: BSEC2 (IAQ) does not run on
; ESP32-C6/H2/P4 (no Bosch prebuilt for these targets; the unit_BME688.hpp gate stays off).
; Tab5 (ESP32-P4) does not even link: P4 uses the hard-float ABI, but the bsec2 riscv prebuilt
; (esp32c3) is soft-float only ("can't link soft-float modules with single-float modules").


; Native (desktop) test base. Only the framework-independent headers are testable here
; (src/* and src/unit/* pull in Arduino / M5UnitUnified headers not available on native),
; so src is not built; tests include headers directly via -Isrc.
; Each data-test suite defines its own env extending this (e.g. test_native_SPA06_data).
[test_native]
platform = native
test_ignore= embedded/*
test_build_src = no
build_flags = ${env.build_flags} -std=gnu++14 -Isrc
lib_deps = google/googletest@1.12.1

; --------------------------------
;Choose framework
[arduino_latest]
platform = espressif32 @ 6.12.0
framework = arduino


[pioarduino_latest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino


; --------------------------------
;Choose build options
[option_release]
build_type=release
build_flags = ${env.build_flags}   
  -DCORE_DEBUG_LEVEL=3
  -DLOG_LOCAL_LEVEL=3
  -DAPP_LOG_LEVEL=3
  -DM5_LOG_LEVEL=3

[option_log]
build_type=release
build_flags = ${env.build_flags} 
  -DCORE_DEBUG_LEVEL=5
  -DLOG_LOCAL_LEVEL=5
  -DAPP_LOG_LEVEL=5

[option_debug]
build_type=debug
build_flags = ${env.build_flags} 
  -DCORE_DEBUG_LEVEL=5
  -DLOG_LOCAL_LEVEL=5
  -DAPP_LOG_LEVEL=5
  -DDEBUG

[option_map]
build_type=release
build_flags = ${env.build_flags} 
  -DCORE_DEBUG_LEVEL=3
  -DLOG_LOCAL_LEVEL=3
  -DAPP_LOG_LEVEL=3
  -DM5_LOG_LEVEL=0
  -Wl,-Map,output.map

; Require at least C++14 after 1.13.0 
[test_fw]
lib_deps = google/googletest@1.12.1
