  +<../examples/UnitUnified/ViaPaHub/>
  -<../examples/UnitUnified/ViaPaHub/build/>
  -<../examples/UnitUnified/ViaPaHub/managed_components/>
lib_deps = ${NanoC6.lib_deps}
