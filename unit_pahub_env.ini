; For ENV units via UnitPaHub

[env:-----------------------------------------separator_pahub_0]

; ================================
; ViaPaHub (UnitCO2 / UnitCO2L / UnitENVIII / UnitENVIV / UnitENVPro / UnitTVOC on one PaHub)
; ================================
; M5Unit-HUB is an example-only dependency (not in library.json / library.properties)

; --------------------------------
; Examples
; --------------------------------
[env:ViaPaHub_Core_Arduino_latest]
extends=Core, option_release, arduino_latest
build_src_filter = +<*> -<.git/> -<.svn/>
  +<../examples/UnitUnified/ViaPaHub/>
  -<../examples/UnitUnified/ViaPaHub/build/>
  -<../examples/UnitUnified/ViaPaHub/managed_components/>
lib_deps = ${Core.lib_deps}
  m5stack/M5Unit-HUB

[env:ViaPaHub_CoreS3_Arduino_latest]
extends=CoreS3, option_release, arduino_latest
build_src_filter = +<*> -<.git/> -<.svn/>
  +<../examples/UnitUnified/ViaPaHub/>
  -<../examples/UnitUnified/ViaPaHub/build/>
  -<../examples/UnitUnified/ViaPaHub/managed_components/>
lib_deps = ${CoreS3.lib_deps}
  m5stack/M5Unit-HUB

[env:ViaPaHub_NanoC6_Arduino_latest]
extends=NanoC6, option_release, pioarduino_latest
