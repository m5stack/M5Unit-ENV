name: Build(esp-idf-native)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'CMakeLists.txt'
      - 'idf_component.yml'
      - 'components/**'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - 'examples/UnitUnified/**/CMakeLists.txt'
      - 'examples/UnitUnified/**/Kconfig.projbuild'
      - 'examples/UnitUnified/**/idf_component.yml'
      - 'examples/UnitUnified/common/**'
      - '.github/workflows/esp-idf-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'CMakeLists.txt'
      - 'idf_component.yml'
      - 'components/**'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - 'examples/UnitUnified/**/CMakeLists.txt'
      - 'examples/UnitUnified/**/Kconfig.projbuild'
      - 'examples/UnitUnified/**/idf_component.yml'
      - 'examples/UnitUnified/common/**'
      - '.github/workflows/esp-idf-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cross design: example/variant coverage on esp32s3 (latest IDF; device-specific examples on their
# own chip), and library/deps coverage on the chip x IDF matrix via one representative example.
# Because the M5Unit-ENV component globs all src/unit/*.cpp, every example build compiles the full
# sensor driver set -- so a single example already exercises the whole library per (target, idf).
# Job A therefore sweeps the per-example app code + Kconfig variants once (esp32s3 / v6.1); Job B
# sweeps the IDF-sensitive library + wiring + bme68x/bsec2 recipes across all SoCs and IDF
# boundaries using ENVPro (the heaviest example: BME688 raw via bme68x on every target, plus BSEC2
# gating on/off).
jobs:
  # Example & variant coverage: every example app + ENVIII Unit/Hat + ENVPro BSEC2 off/on, on
  # esp32s3 (LCD-capable dual-core Xtensa with PSRAM) at the latest IDF. Device-specific examples
  # build on their own chip instead: HatYun (StickC series) and Paper (M5Paper) on esp32. ViaPaHub
  # (multi-unit hub example) builds on the esp32 representative only (M5Unit-HUB is fetched from its
  # main branch; this entry fails until M5Unit-HUB publishes its ESP-IDF manifest there). ENVPro
  # BSEC2-on downloads the Bosch prebuilt at configure time (no bytes committed) and verifies the
  # link path.
  build-examples:
    name: v6.1 ${{ matrix.example_config.target }} ${{ matrix.example_config.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        example_config:
          - label: UnitCO2 (SCD40)
            example_path: examples/UnitUnified/UnitCO2/PlotToSerial
            target: esp32s3
            config: ''
          - label: UnitCO2L (SCD41)
            example_path: examples/UnitUnified/UnitCO2L/PlotToSerial
            target: esp32s3
            config: ''
          - label: UnitENVIII (Unit)
            example_path: examples/UnitUnified/UnitENVIII/PlotToSerial
            target: esp32s3
            config: CONFIG_EXAMPLE_USING_UNIT_ENV3=y
          - label: UnitENVIII (Hat)
            example_path: examples/UnitUnified/UnitENVIII/PlotToSerial
            target: esp32s3
            config: CONFIG_EXAMPLE_USING_HAT_ENV3=y
          - label: UnitENVIV (SHT40+BMP280)
            example_path: examples/UnitUnified/UnitENVIV/PlotToSerial
            target: esp32s3
            config: ''
          - label: UnitENVPro BSEC2-OFF (BME688 raw)
            example_path: examples/UnitUnified/UnitENVPro/PlotToSerial
            target: esp32s3
            config: ''
          - label: UnitENVPro BSEC2-ON (BME688 IAQ)
            example_path: examples/UnitUnified/UnitENVPro/PlotToSerial
            target: esp32s3
            config: CONFIG_M5UNIT_ENV_ENABLE_BSEC2=y
          - label: UnitMiniBPS11 (QMP6988)
            example_path: examples/UnitUnified/UnitMiniBPS11/PlotToSerial
            target: esp32s3
            config: ''
          - label: UnitTVOC (SGP30)
            example_path: examples/UnitUnified/UnitTVOC/PlotToSerial
            target: esp32s3
            config: ''
          - label: HatYun (SHT20+BMP280)
            example_path: examples/UnitUnified/HatYun/HatYunEnvironmentGlow
            target: esp32
            config: ''
          - label: Paper (builtin SHT30)
            example_path: examples/UnitUnified/Paper
            target: esp32
            config: ''
          - label: ViaPaHub (CO2 / CO2L / ENVIII / ENVIV / ENVPro / TVOC)
            example_path: examples/UnitUnified/ViaPaHub
            target: esp32
            config: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use in-repo components
        # The root manifest fetches bme68x / bsec2 from this repo's master via git (needed when
        # M5Unit-ENV is consumed as a git dependency). Point them at the checked-out components/
        # in the CI workspace only, so a change under components/ is built by its own PR.
        run: |
          sed -i -e '\#^    git: https://github.com/m5stack/M5Unit-ENV\.git$#d' -e '/^    version: master$/d' idf_component.yml
          if grep -q 'M5Unit-ENV\.git' idf_component.yml; then
            echo "idf_component.yml still references M5Unit-ENV via git" >&2
            exit 1
          fi

      - name: Select Kconfig variant
        # The example's own sdkconfig.defaults is not read (top CMakeLists points SDKCONFIG_DEFAULTS
        # at common/sdkconfig.defaults). Append the choice to common/ in the CI workspace only.
        if: matrix.example_config.config != ''
        run: |
          echo "" >> examples/UnitUnified/common/sdkconfig.defaults
          echo "${{ matrix.example_config.config }}" >> examples/UnitUnified/common/sdkconfig.defaults

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.example_config.target }}
          path: ${{ matrix.example_config.example_path }}

  # Library / wiring / deps coverage across the chip x IDF matrix using ENVPro (raw, BSEC2 default
  # off). esp32 = classic Xtensa dual-core (M5Unified touch-deprecation path). esp32s3 = Xtensa
  # dual-core + PSRAM. esp32c3 = RISC-V single-core with the bsec2 dependency declared (gated off by
  # default). esp32c6 / esp32h2 = RISC-V single-core (app_main CONFIG_FREERTOS_UNICORE
  # feedIdle branch; bsec2 is NOT a dependency here -- gated off in the root manifest -> bme68x raw
  # only). esp32p4 (M5Stack Tab5) = RISC-V dual-core; sdkconfig.defaults.esp32p4 overlay auto-applied.
  # idf boundaries: 5.1.7 = oldest legacy-driver (5.0.x dropped: M5GFX needs esp_mm added in 5.1),
  # 5.4.4 = new driver/*_master.h + touch_sens.h era, 5.5.4 = latest 5.x, 6.1 = latest.
  build-targets:
    name: ${{ matrix.idf }} ${{ matrix.target }} UnitENVPro
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target: [esp32, esp32s3, esp32c3, esp32c6, esp32h2, esp32p4]
        idf: [v5.1.7, v5.4.4, v5.5.4, v6.1]
        exclude:
          # esp32p4 stable from IDF v5.3 (M5GFX P4 verified on 5.4/5.5). 5.1.7 not applicable.
          - target: esp32p4
            idf: v5.1.7
          # Covered by build-examples (esp32s3 x v6.1).
          - target: esp32s3
            idf: v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use in-repo components
        # The root manifest fetches bme68x / bsec2 from this repo's master via git (needed when
        # M5Unit-ENV is consumed as a git dependency). Point them at the checked-out components/
        # in the CI workspace only, so a change under components/ is built by its own PR.
        run: |
          sed -i -e '\#^    git: https://github.com/m5stack/M5Unit-ENV\.git$#d' -e '/^    version: master$/d' idf_component.yml
          if grep -q 'M5Unit-ENV\.git' idf_component.yml; then
            echo "idf_component.yml still references M5Unit-ENV via git" >&2
            exit 1
          fi

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/UnitUnified/UnitENVPro/PlotToSerial

  # BSEC2 link coverage for the other Bosch prebuilt blobs and the oldest toolchain. build-examples
  # links esp32s3 only at v6.1; esp32 (Xtensa) and esp32c3 (RISC-V soft-float) use separate
  # libalgobsec.a, and v5.1.7 (GCC 12) is the oldest IDF boundary the blob must link with.
  build-bsec2:
    name: ${{ matrix.idf }} ${{ matrix.target }} UnitENVPro BSEC2-ON
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - target: esp32
            idf: v6.1
          - target: esp32c3
            idf: v6.1
          - target: esp32s3
            idf: v5.1.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use in-repo components
        # The root manifest fetches bme68x / bsec2 from this repo's master via git (needed when
        # M5Unit-ENV is consumed as a git dependency). Point them at the checked-out components/
        # in the CI workspace only, so a change under components/ is built by its own PR.
        run: |
          sed -i -e '\#^    git: https://github.com/m5stack/M5Unit-ENV\.git$#d' -e '/^    version: master$/d' idf_component.yml
          if grep -q 'M5Unit-ENV\.git' idf_component.yml; then
            echo "idf_component.yml still references M5Unit-ENV via git" >&2
            exit 1
          fi

      - name: Select Kconfig variant
        run: |
          echo "" >> examples/UnitUnified/common/sdkconfig.defaults
          echo "CONFIG_M5UNIT_ENV_ENABLE_BSEC2=y" >> examples/UnitUnified/common/sdkconfig.defaults

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/UnitUnified/UnitENVPro/PlotToSerial
