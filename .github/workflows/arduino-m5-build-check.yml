name: Build(arduino-m5stack)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified,BME68x Sensor library,M5Unit-HUB

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '!examples/UnitUnified/UnitENVIII/**'
      - '.github/workflows/arduino-m5-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '!examples/UnitUnified/UnitENVIII/**'
      - '.github/workflows/arduino-m5-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json

        sketch:
          - PlotToSerial

        unit:
          - UnitCO2
          - UnitCO2L
          - UnitENVIV
          - UnitTVOC
          - UnitENVPro
          - UnitMiniBPS11

        # Reduced to distinct compile configs (toolchain x chip-arch + distinct build-property boards).
        # Pure variant-header siblings (same chip-arch, same build property) are commented out;
        # they compile identically because library code branches at runtime via M5.getBoard().
        board:
          - m5stack_core        # ESP32 representative (xtensa-esp32, BSEC2 not installed by default)
          - m5stack_cores3      # ESP32-S3 representative (xtensa-esp32s3)
          - m5stack_nano_c6     # ESP32-C6 representative (rv32, IDF5.x, no BSEC2 prebuilt)
          - m5stack_nano_h2    # ESP32-H2 representative (rv32, H2 image target, no BSEC2 prebuilt)
          - m5stack_tab5        # ESP32-P4 representative (rv32 single-float FPU, no BSEC2 prebuilt)
          # Distinct build-property boards (PSRAM / OPI flash / USB-CDC differ from cores3) - kept
          - m5stack_atoms3r     # ESP32-S3 with distinct PSRAM/memory_type build property
          - m5stack_cardputer   # ESP32-S3 with distinct PSRAM/USB build property
          - m5stack_papers3     # ESP32-S3 with distinct PSRAM/EPD build property
          - m5stack_sticks3     # ESP32-S3 with distinct build property
          - m5stack_stamp_s3    # ESP32-S3 StampS3 with distinct build property
          # M5 fork exclusive board not present in espressif package - distinct config, kept
          - arduino_nesso_n1    # ESP32-C6 NessoN1 (M5 fork exclusive)
          # Pure variant-header siblings (commented out)
#          - m5stack_atom        # ESP32: represented by m5stack_core
#          - m5stack_atoms3      # ESP32-S3: represented by m5stack_cores3
#          - m5stack_capsule     # ESP32: represented by m5stack_core
#          - m5stack_chain_dualkey
#          - m5stack_core2       # ESP32: represented by m5stack_core
#          - m5stack_coreink     # ESP32: represented by m5stack_core
#          - m5stack_dial        # ESP32-S3: represented by m5stack_cores3
#          - m5stack_dinmeter    # ESP32-S3: represented by m5stack_cores3
#          - m5stack_fire        # ESP32: represented by m5stack_core
#          - m5stack_paper       # ESP32: represented by m5stack_core (built separately via Paper sketch include below)
#          - m5stack_poe_cam
#          - m5stack_powerhub
#          - m5stack_stamp_c3
#          - m5stack_stamp_pico
#          - m5stack_stamplc
#          - m5stack_station
#          - m5stack_stickc      # ESP32: represented by m5stack_core
#          - m5stack_stickc_plus # ESP32: represented by m5stack_core
#          - m5stack_stickc_plus2 # ESP32: represented by m5stack_core
#          - m5stack_timer_cam
#          - m5stack_tough
#          - m5stack_unit_c6l
#          - m5stack_unit_cam
#          - m5stack_unit_cams3

        platform-version:
          - 3.2.5

        platform:
          - m5stack

        archi:
          - esp32

        include:
          # Specific sketches
          # ViaPaHub (CO2 / CO2L / ENVIII / ENVIV / ENVPro / TVOC on one PaHub). Core only.
          - sketch: ViaPaHub
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.2.5
            board: m5stack_core
            unit: ''
          # Paper
          - sketch: Paper
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.2.5
            board: m5stack_paper
            unit: ''
          # HatYun (StickC / StickCPlus / StickCPlus2)
          - sketch: HatYunEnvironmentGlow
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.2.5
            board: m5stack_stickc
            unit: HatYun
          - sketch: HatYunEnvironmentGlow
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.2.5
            board: m5stack_stickc_plus
            unit: HatYun
          - sketch: HatYunEnvironmentGlow
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.2.5
            board: m5stack_stickc_plus2
            unit: HatYun

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.unit }}/${{ matrix.sketch }}

  # UnitENVPro with BSEC2 (IAQ): installing bsec2 turns on the __has_include gate.
  # One board per Bosch prebuilt blob arch (esp32 / esp32s3); other targets have no prebuilt.
  build-bsec2:
    name: UnitENVPro+BSEC2:PlotToSerial:${{ matrix.board }}@${{ matrix.platform-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json

        board:
          - m5stack_core          # esp32 prebuilt blob
          - m5stack_cores3        # esp32s3 prebuilt blob

        platform-version:
          - 3.2.5

        platform:
          - m5stack

        archi:
          - esp32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES,bsec2" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/UnitENVPro/PlotToSerial
