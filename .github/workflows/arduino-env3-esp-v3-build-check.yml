name: Build ENVIII(arduino-esp32:3.x)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified/UnitENVIII
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified,BME68x Sensor library

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/UnitENVIII/**.ino'
      - 'examples/UnitUnified/UnitENVIII/**.cpp'
      - 'examples/UnitUnified/UnitENVIII/**.hpp'
      - 'examples/UnitUnified/UnitENVIII/**.h'
      - 'examples/UnitUnified/UnitENVIII/**.c'
      - '.github/workflows/arduino-env3-esp-v3-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/UnitENVIII/**.ino'
      - 'examples/UnitUnified/UnitENVIII/**.cpp'
      - 'examples/UnitUnified/UnitENVIII/**.hpp'
      - 'examples/UnitUnified/UnitENVIII/**.h'
      - 'examples/UnitUnified/UnitENVIII/**.c'
      - '.github/workflows/arduino-env3-esp-v3-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.build-properties }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://espressif.github.io/arduino-esp32/package_esp32_index.json

        sketch:
          - PlotToSerial

        board:
          # Reduced to chip-arch representatives (ESP32 / S3 / C6 / P4). Unit is fixed to ENV3,
          # so only the board (FQBN) axis is reduced. H2 is unavailable in the esp32:esp32 package.
          - m5stack_core      # ESP32 (xtensa) representative
          - m5stack_cores3    # ESP32-S3 (xtensa-s3) representative
          - m5stack_nanoc6    # ESP32-C6 (rv32) representative
          - m5stack_tab5      # ESP32-P4 (rv32 single-float FPU) representative
          # - arduino_nesso_n1  # ESP32-C6: represented by m5stack_nanoc6
          # - m5stack_atom      # ESP32: represented by m5stack_core
          # - m5stack_atoms3    # ESP32-S3: represented by m5stack_cores3
          # - m5stack_capsule   # ESP32: represented by m5stack_core
          # - m5stack_cardputer # ESP32-S3: represented by m5stack_cores3
          # - m5stack_core2     # ESP32: represented by m5stack_core
          # - m5stack_coreink   # ESP32: represented by m5stack_core
          # - m5stack_dial      # ESP32-S3: represented by m5stack_cores3
          # - m5stack_dinmeter  # ESP32-S3: represented by m5stack_cores3
          # - m5stack_fire      # ESP32: represented by m5stack_core
          # - m5stack_paper     # ESP32: represented by m5stack_core
          # - m5stack_stamp_s3  # ESP32-S3: represented by m5stack_cores3
          # - m5stack_stickc_plus   # ESP32: represented by m5stack_core
          # - m5stack_stickc_plus2  # ESP32: represented by m5stack_core

        platform-version:
          - 3.3.12

        platform:
          - esp32

        archi:
          - esp32

        build-properties:
          - "-DUSING_UNIT_ENV3"

        include:
          # HatENV3: separate build path via #if USING_HAT_ENV3 (addHatI2C). The Hat runs on
          # StickC-shaped boards; keep one StickC-family representative, comment out siblings.
          - sketch: PlotToSerial
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform-version: 3.3.12
            platform: esp32
            archi: esp32
            board: m5stack_stickc_plus
            build-properties: "-DUSING_HAT_ENV3"
          # - sketch: PlotToSerial  # StickC-family sibling: represented by m5stack_stickc_plus
          #   platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          #   platform-version: 3.3.12
          #   platform: esp32
          #   archi: esp32
          #   board: m5stack_stickc_plus2
          #   build-properties: "-DUSING_HAT_ENV3"
          # - sketch: PlotToSerial  # StickC-family sibling: represented by m5stack_stickc_plus
          #   platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          #   platform-version: 3.3.12
          #   platform: esp32
          #   archi: esp32
          #   board: m5stack_coreink
          #   build-properties: "-DUSING_HAT_ENV3"
          # - sketch: PlotToSerial  # StickC-family sibling: represented by m5stack_stickc_plus
          #   platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          #   platform-version: 3.3.12
          #   platform: esp32
          #   archi: esp32
          #   board: arduino_nesso_n1
          #   build-properties: "-DUSING_HAT_ENV3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.sketch }}
          cli-compile-flags: |
            - --build-property
            - build.extra_flags=${{ matrix.build-properties }}
