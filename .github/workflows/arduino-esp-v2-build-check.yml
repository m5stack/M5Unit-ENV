name: Build(arduino-esp32:2.x)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified,BME68x Sensor library,M5Unit-HUB

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '!examples/UnitUnified/UnitENVIII/**'
      - '.github/workflows/arduino-esp-v2-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '!examples/UnitUnified/UnitENVIII/**'
      - '.github/workflows/arduino-esp-v2-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://espressif.github.io/arduino-esp32/package_esp32_index.json

        sketch:
          - PlotToSerial

        unit:
          - UnitCO2
          - UnitCO2L
          - UnitENVIV
          - UnitTVOC
          - UnitENVPro
          - UnitMiniBPS11

        board:
          # Build-safe minimal set: one board per distinct compile config.
          # arduino-esp32 core 2.0.x supports only ESP32 / ESP32-S3
          # (no C6/H2/P4). Keep one ESP32 + one S3 representative; sibling
          # boards differ only by variant header and are commented out
          # (re-enable to also catch variant-specific build breaks).
          # - m5stack-atom        # ESP32: represented by m5stack-core-esp32
          # - m5stack-atoms3      # ESP32-S3: represented by m5stack-cores3
          - m5stack-core-esp32    # ESP32 (BSEC2 not installed by default)
          # - m5stack-core2       # ESP32: represented by m5stack-core-esp32
          # - m5stack-coreink     # ESP32: represented by m5stack-core-esp32
          - m5stack-cores3        # ESP32-S3
          # - m5stack-fire        # ESP32: represented by m5stack-core-esp32

        platform-version:
          - 2.0.17

        platform:
          - esp32

        archi:
          - esp32

        include:
          # ViaPaHub (CO2 / CO2L / ENVIII / ENVIV / ENVPro / TVOC on one PaHub). Core only.
          - sketch: ViaPaHub
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform: esp32
            archi: esp32
            platform-version: 2.0.17
            board: m5stack-core-esp32
            unit: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.unit }}/${{ matrix.sketch }}

  # UnitENVPro with BSEC2 (IAQ): installing bsec2 turns on the __has_include gate.
  # One board per Bosch prebuilt blob arch (esp32 / esp32s3); other targets have no prebuilt.
  build-bsec2:
    name: UnitENVPro+BSEC2:PlotToSerial:${{ matrix.board }}@${{ matrix.platform-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://espressif.github.io/arduino-esp32/package_esp32_index.json

        board:
          - m5stack-core-esp32    # esp32 prebuilt blob
          - m5stack-cores3        # esp32s3 prebuilt blob

        platform-version:
          - 2.0.17

        platform:
          - esp32

        archi:
          - esp32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES,bsec2" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/UnitENVPro/PlotToSerial
