name: Build(arduino-esp32:3.x)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified,BME68x Sensor library,M5Unit-HUB

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '!examples/UnitUnified/UnitENVIII/**'
      - '.github/workflows/arduino-esp-v3-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '!examples/UnitUnified/UnitENVIII/**'
      - '.github/workflows/arduino-esp-v3-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://espressif.github.io/arduino-esp32/package_esp32_index.json

        sketch:
          - PlotToSerial

        unit:
          - UnitCO2
          - UnitCO2L
          - UnitENVIV
          - UnitTVOC
          - UnitENVPro
          - UnitMiniBPS11

        board:
          # Build-safe minimal set: one board per distinct compile config
          # (toolchain x chip arch x deps). Sibling boards differ only by
          # variant header and are commented out (re-enable to also catch
          # variant-specific build breaks). Boards with distinct build
          # properties (PSRAM/USB/partition) are kept even within an arch.
          # arduino-esp32 3.x covers ESP32 / S3 / C6 / P4 (no H2 FQBN in this package).
#          - arduino_nesso_n1   # ESP32-C6: represented by m5stack_nanoc6
#          - m5stack_atom       # ESP32: represented by m5stack_core
#          - m5stack_atoms3     # ESP32-S3: represented by m5stack_cores3
#          - m5stack_capsule    # ESP32-S3: represented by m5stack_cores3
          - m5stack_cardputer   # ESP32-S3: kept (distinct build properties)
          - m5stack_core        # ESP32 (BSEC2 not installed by default)
#          - m5stack_core2      # ESP32: represented by m5stack_core
#          - m5stack_coreink    # ESP32: represented by m5stack_core
          - m5stack_cores3      # ESP32-S3
#          - m5stack_dial       # ESP32-S3: represented by m5stack_cores3
#          - m5stack_dinmeter   # ESP32-S3: represented by m5stack_cores3
#          - m5stack_fire       # ESP32: represented by m5stack_core
          - m5stack_nanoc6      # ESP32-C6 (no BSEC2 prebuilt)
#          - m5stack_paper      # ESP32: represented by m5stack_core (Paper.cpp built via include)
#          - m5stack_poe_cam
#          - m5stack_stamp_c3
#          - m5stack_stamp_pico
          - m5stack_stamp_s3    # ESP32-S3: kept (distinct build properties)
#          - m5stack_station
#          - m5stack_stickc
#          - m5stack_stickc_plus    # ESP32: represented by m5stack_core (Hat built via include)
#          - m5stack_stickc_plus2   # ESP32: represented by m5stack_core
          - m5stack_tab5        # ESP32-P4 (16MB part, no BSEC2 prebuilt)
#          - m5stack_timer_cam
#          - m5stack_tough
#          - m5stack_unit_cam
#          - m5stack_unit_cams3

        platform-version:
          - 3.3.12

        platform:
          - esp32

        archi:
          - esp32

        include:
          # Specific sketches
          # ViaPaHub (CO2 / CO2L / ENVIII / ENVIV / ENVPro / TVOC on one PaHub). Core only.
          - sketch: ViaPaHub
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform: esp32
            archi: esp32
            platform-version: 3.3.12
            board: m5stack_core
            unit: ''
          # Paper
          - sketch: Paper
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform: esp32
            archi: esp32
            platform-version: 3.3.12
            board: m5stack_paper
            unit: ''
          # HatYun (StickCPlus / StickCPlus2)
          - sketch: HatYunEnvironmentGlow
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform: esp32
            archi: esp32
            platform-version: 3.3.12
            board: m5stack_stickc_plus
            unit: HatYun
          - sketch: HatYunEnvironmentGlow
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform: esp32
            archi: esp32
            platform-version: 3.3.12
            board: m5stack_stickc_plus2
            unit: HatYun

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.unit }}/${{ matrix.sketch }}

  # UnitENVPro with BSEC2 (IAQ): installing bsec2 turns on the __has_include gate.
  # One board per Bosch prebuilt blob arch (esp32 / esp32s3); other targets have no prebuilt.
  build-bsec2:
    name: UnitENVPro+BSEC2:PlotToSerial:${{ matrix.board }}@${{ matrix.platform-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://espressif.github.io/arduino-esp32/package_esp32_index.json

        board:
          - m5stack_core          # esp32 prebuilt blob
          - m5stack_cores3        # esp32s3 prebuilt blob

        platform-version:
          - 3.3.12

        platform:
          - esp32

        archi:
          - esp32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES,bsec2" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/UnitENVPro/PlotToSerial
